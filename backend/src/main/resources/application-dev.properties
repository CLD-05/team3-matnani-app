spring.application.name=matnani

server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# DB ? SPRING_DATASOURCE_URL/USERNAME/PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Business API
business.api.key=${BUSINESS_API_KEY}
business.test-mode=true

# AWS S3 ? CLOUD_AWS_S3_BUCKET
cloud.aws.region=ap-northeast-2
cloud.aws.s3.cdn-url=https://d3af6wedi78ivj.cloudfront.net/images

# Redis ? SPRING_DATA_REDIS_HOST
spring.data.redis.port=6379

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false