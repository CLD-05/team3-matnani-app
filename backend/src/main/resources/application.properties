spring.application.name=matnani

server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

# DB
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Business API
business.test-mode=false

# AWS
cloud.aws.region=ap-northeast-2

# Redis
spring.data.redis.port=6379

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false