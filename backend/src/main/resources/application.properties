spring.application.name=matnani

server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

# DB - 실제 값은 application-local.properties 에서 설정
spring.datasource.url=jdbc:mysql://localhost:3306/matnani?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT - 실제 시크릿은 application-local.properties 에서 설정
jwt.secret=
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# 사업자 인증 API - 실제 키는 application-local.properties 에서 설정
business.api.key=

# AWS S3 - 실제 키는 application-local.properties 에서 설정
cloud.aws.credentials.access-key=
cloud.aws.credentials.secret-key=
cloud.aws.region=ap-northeast-2
cloud.aws.s3.bucket=matnani-bucket
cloud.aws.s3.cdn-url=

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.profiles.active=dev
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true