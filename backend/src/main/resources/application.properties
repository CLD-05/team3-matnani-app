spring.application.name=matnani
server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:matnani}?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:mat}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=matnani-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000


business.api.key=????_API_?

spring.profiles.active=dev
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

jwt.refresh-expiration=604800000

cloud.aws.credentials.access-key=????_ACCESS_KEY
cloud.aws.credentials.secret-key=????_SECRET_KEY
cloud.aws.region=ap-northeast-2
cloud.aws.s3.bucket=matnani-bucket

cloud.aws.s3.cdn-url=https://cdn.matnani.com

#Redis ??
spring.data.redis.host=localhost
spring.data.redis.port=6379