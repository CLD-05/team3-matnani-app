name: Backend CI/CD to AWS ECR

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  build-and-push:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set Environment
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ENV="dev"
          else
            ENV="${{ github.event.inputs.environment }}"
          fi

          if [ "$ENV" = "dev" ]; then
            echo "ROLE_ARN=${{ secrets.AWS_DEV_ROLE_ARN }}" >> $GITHUB_ENV
            echo "ECR_REPOSITORY=team3-matnani-dev-api" >> $GITHUB_ENV
            echo "OVERLAY=dev" >> $GITHUB_ENV
          else
            echo "ROLE_ARN=${{ secrets.AWS_PROD_ROLE_ARN }}" >> $GITHUB_ENV
            echo "ECR_REPOSITORY=team3-matnani-prod-api" >> $GITHUB_ENV
            echo "OVERLAY=prod" >> $GITHUB_ENV
          fi
      

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

#      # mvnw 실행 권한 부여
#      - name: Grant execute permission
#        working-directory: backend
#        run: chmod +x mvnw

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV


      # 이미지 빌드 + 푸시
      - name: Build & Push Docker image
        working-directory: backend
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # kustomize 설치
      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      # kustomization.yaml의 이미지 태그 자동 업데이트
      - name: Update Kustomize Image Tag
        id: kustomize
        run: |
          git config --global user.name "team3-matnani-ci-bot"
          git config --global user.email "ci-bot@users.noreply.github.com"

          git clone https://${{ secrets.GH_PAT }}@github.com/CLD-05/team3-matnani-config.git config-repo

          CONFIG_REPO_DIR=$(pwd)/config-repo
          cd "$CONFIG_REPO_DIR/apps/team3-matnani/overlays/$OVERLAY"

          kustomize edit set image \
            team3-matnani-api=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          cd "$CONFIG_REPO_DIR"

          if git diff --quiet; then
            echo "이미지 태그 변경 없음 — 건너뜀"
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          BRANCH="ci/bump-${OVERLAY}-${IMAGE_TAG}"
          git checkout -b "$BRANCH"
          git add .
          git commit -m "deploy(${OVERLAY}): team3-app 이미지 ${IMAGE_TAG} 반영"
          git push origin "$BRANCH" --force

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "skipped=false" >> $GITHUB_OUTPUT


      # Config Repo PR + Merge
      # Dev는 자동 Merge, Prod는 수동 승인 후 Merge
      - name: Create PR & Merge to Config Repo
        if: steps.kustomize.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_URL=$(gh pr create \
            --repo CLD-05/team3-matnani-config \
            --base main \
            --head "$BRANCH" \
            --title "deploy(${OVERLAY}): backend ${IMAGE_TAG}" \
            --body "Update backend image tag to ${IMAGE_TAG}. dev는 merge 시 ArgoCD가 자동 배포, prod는 수동 확인 후 배포")
          
          if [ "$OVERLAY" = "dev" ]; then
            echo "Auto merge for dev"
          
            for i in {1..10}; do
              STATE=$(gh pr view "$PR_URL" --repo CLD-05/team3-matnani-config --json mergeStateStatus --jq '.mergeStateStatus')
              echo "PR state: $STATE"
              if [ "$STATE" = "CLEAN" ]; then
                break
              fi
              sleep 3
            done
          
            gh pr merge "$PR_URL" \
              --repo CLD-05/team3-matnani-config \
              --squash \
              --delete-branch
          
          else
            echo "PROD 환경 Merge 전 승인 필요"
            echo "리뷰 후 Merge 해주세요."
            echo "$PR_URL"
            echo "Merge가 완료되어야 ArgoCD가 자동으로 동기화됩니다."
          fi